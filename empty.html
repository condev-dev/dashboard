<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8d43f5">
  <title>انبار | داشبورد میلان</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('milan-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="empty">

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="app-shell">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="appSidebar">
    <div class="brand">
      <a class="brand-logo" href="index.html" aria-label="داشبورد میلان"><img src="assets/logo.svg" alt="MILAN Sport Wear"></a>
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="بستن منو">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <label class="sidebar-search">
      <i class="fas fa-magnifying-glass"></i>
      <input type="text" placeholder="جستجو…" aria-label="جستجو در پنل">
    </label>

    <nav class="main-nav" aria-label="منوی اصلی">
      <a class="nav-item" href="index.html" data-page="dashboard"><i class="fas fa-th-large"></i><span>داشبورد</span></a>
      <a class="nav-item" href="sales.html" data-page="sales"><i class="fas fa-chart-line"></i><span>فروش</span></a>
      <a class="nav-item" href="products.html" data-page="products"><i class="fas fa-tshirt"></i><span>محصولات</span></a>
      <a class="nav-item" href="orders.html" data-page="orders"><i class="fas fa-shopping-bag"></i><span>سفارشات</span></a>
      <a class="nav-item" href="customers.html" data-page="customers"><i class="fas fa-users"></i><span>مشتریان</span></a>
      <a class="nav-item" href="reports.html" data-page="reports"><i class="fas fa-chart-pie"></i><span>گزارشات</span></a>
      <a class="nav-item" href="empty.html" data-page="empty"><i class="fas fa-boxes-stacked"></i><span>انبار</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <span class="user-avatar">
          <img src="assets/avatar.svg" alt="">
          <i class="avatar-status" aria-hidden="true"></i>
        </span>
        <span class="user-meta">
          <strong>مدیر فروشگاه</strong>
          <small id="todayLabel">امروز</small>
        </span>
      </div>
      <div class="foot-social">
        <span class="foot-credit">طراحی و توسعه <b>ConDev</b></span>
        <span class="foot-actions">
          <a class="foot-icon" href="https://www.instagram.com/con.dev" target="_blank" rel="noopener" data-tip="اینستاگرام ConDev" aria-label="اینستاگرام ConDev"><i class="fab fa-instagram"></i></a>
          <a class="foot-icon" href="https://www.condev.ir/" target="_blank" rel="noopener" data-tip="وب‌سایت ConDev" aria-label="وب‌سایت ConDev"><i class="fas fa-globe"></i></a>
        </span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="content-area">
      <div class="page">

        <header class="topbar">
          <div class="topbar-main">
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="باز کردن منو" aria-controls="appSidebar" aria-expanded="false">
              <i class="fas fa-bars"></i>
            </button>
            <span class="topbar-badge"><i class="fas fa-boxes-stacked"></i></span>
            <div class="topbar-text">
              <h1>گزارش انبار</h1>
              <p>این بخش هنوز محتوایی ندارد</p>
            </div>
          </div>
          <div class="topbar-side">
            <span class="pill"><i class="far fa-calendar"></i><span class="num" id="todayPill">امروز</span></span>
            <a class="icon-btn notification" href="https://www.instagram.com/con.dev" target="_blank" rel="noopener" data-tip="اینستاگرام ConDev" aria-label="اینستاگرام ConDev"><i>۳</i><i class="fas fa-bell"></i></a>
            <button class="icon-btn theme-btn" id="themeBtn" type="button" data-theme-toggle data-tip="تغییر پوسته" aria-label="تغییر پوسته" aria-pressed="false">
              <i class="fas fa-moon i-moon"></i>
              <i class="fas fa-sun i-sun"></i>
            </button>
          </div>
        </header>

        <section class="panel empty-panel">
          <div class="empty-art"><i class="fas fa-folder-open"></i></div>
          <strong>این بخش خالی است</strong>
          <p>هنوز داده‌ای در این بخش ثبت نشده است. به محض ثبت اولین داده، اطلاعات اینجا نمایش داده می‌شود.</p>
          <div class="empty-actions">
            <a class="btn btn-solid" href="https://www.instagram.com/con.dev" target="_blank" rel="noopener"><i class="fas fa-plus"></i><span>افزودن اولین مورد</span></a>
            <a class="btn btn-ghost" href="index.html"><i class="fas fa-arrow-right"></i><span>بازگشت به داشبورد</span></a>
          </div>
        </section>

      </div>
    </div>
  </main>
</div>

<script src="vendor/js/app.js"></script>
</body>
</html>
